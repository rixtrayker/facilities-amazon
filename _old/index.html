<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FacilityOps — Amazon Now Egypt</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css" />

  <style>
/* ── tokens ───────────────────────────────────────────── */
:root {
  --bg:           #F6F5F1;      /* warm paper */
  --bg-sub:       #EFEDE6;
  --surface:      #FFFFFF;
  --surface-2:    #FBFAF7;
  --line:         #E6E3DA;
  --line-strong:  #D7D3C7;

  --ink:          #14130F;
  --ink-2:        #2C2A24;
  --muted:        #6F6B5F;
  --muted-2:      #A19D90;

  --accent:       #FF9900;      /* amazon orange */
  --accent-ink:   #1A1A1A;
  --accent-soft:  #FFF1DB;
  --accent-line:  #F6C36B;

  --critical:     #C92A2A;
  --critical-soft:#FCE7E7;
  --warning:      #B45309;
  --warning-soft: #FEF3D5;
  --info:         #1D4ED8;
  --info-soft:    #E5EBFB;
  --ok:           #1F7A4D;
  --ok-soft:      #DEF1E3;
  --violet:       #6F37B0;
  --violet-soft:  #EFE3FA;

  --radius-sm: 6px;
  --radius:    10px;
  --radius-lg: 14px;

  --shadow-sm: 0 1px 0 rgba(20,19,15,0.04);
  --shadow:    0 1px 2px rgba(20,19,15,0.04), 0 1px 0 rgba(20,19,15,0.04);
}

/* ── reset ────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }

.mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-feature-settings: 'zero'; }
.serif { font-family: 'Instrument Serif', Georgia, serif; }

/* ── app shell ────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 64px 1fr;
  height: 100vh;
  overflow: hidden;
}

.rail {
  background: #14130F;
  color: #B6B0A0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 4px;
}
.rail-logo {
  width: 36px; height: 36px;
  background: var(--accent);
  color: #14130F;
  border-radius: 8px;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 12px;
  font-family: 'Instrument Serif', serif;
  font-style: italic;
}
.rail-item {
  width: 40px; height: 40px;
  border-radius: 8px;
  display: grid; place-items: center;
  font-size: 18px;
  color: #6F6B5F;
  position: relative;
  cursor: pointer;
  transition: all 0.12s;
}
.rail-item:hover { color: #FAFAF7; background: #1F1E18; }
.rail-item.active { background: #2A2820; color: var(--accent); }
.rail-item .pip {
  position: absolute;
  top: 6px; right: 6px;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
}
.rail-spacer { flex: 1; }
.rail-divider { width: 24px; height: 1px; background: #2A2820; margin: 8px 0; }

/* ── workspace ────────────────────────────────────────── */
.workspace {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.topbar {
  height: 52px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 22px 0 18px;
  gap: 14px;
  flex-shrink: 0;
}
.crumbs {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
  color: var(--muted);
}
.crumbs strong { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--muted-2); }
.crumbs .back {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.crumbs .back:hover { background: var(--bg-sub); }

.search {
  margin-left: auto;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 10px;
  width: 240px;
  color: var(--muted);
}
.search input {
  border: none; outline: none; background: transparent;
  flex: 1; font-size: 13px;
  color: var(--ink);
}
.search .kbd {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted-2);
  background: var(--bg-sub);
  padding: 1px 5px;
  border-radius: 3px;
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  transition: all 0.12s;
  color: var(--ink);
  white-space: nowrap;
}
.btn:hover { background: var(--bg-sub); border-color: var(--line-strong); }
.btn-primary {
  background: var(--ink);
  color: #FAFAF7;
  border-color: var(--ink);
}
.btn-primary:hover { background: #2C2A24; border-color: #2C2A24; }
.btn-accent {
  background: var(--accent);
  color: #1A1A1A;
  border-color: var(--accent);
}
.btn-accent:hover { background: #FFAB2E; border-color: #FFAB2E; }
.btn-ghost {
  background: transparent;
  border-color: transparent;
}
.btn-ghost:hover { background: var(--bg-sub); }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-icon { padding: 6px 7px; }

/* ── canvas ───────────────────────────────────────────── */
.canvas {
  flex: 1;
  overflow: auto;
  padding: 0;
}
.canvas-inner {
  max-width: 1380px;
  margin: 0 auto;
  padding: 24px 28px 64px;
}

/* ── pulse strip ──────────────────────────────────────── */
.pulse {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  overflow-x: auto;
}
.pulse-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pulse-label .live-dot {
  width: 6px; height: 6px;
  background: var(--ok);
  border-radius: 50%;
  position: relative;
}
.pulse-label .live-dot::after {
  content: '';
  position: absolute; inset: -3px;
  border-radius: 50%;
  background: var(--ok);
  opacity: 0.35;
  animation: pulse 2s ease-out infinite;
}
@keyframes pulse {
  0% { transform: scale(0.6); opacity: 0.5; }
  100% { transform: scale(2.4); opacity: 0; }
}
.pulse-stations {
  display: flex; gap: 6px;
  flex: 1;
  flex-wrap: nowrap;
}
.pulse-station {
  display: flex; flex-direction: column;
  gap: 4px;
  padding: 8px 10px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  min-width: 84px;
  cursor: pointer;
  transition: all 0.12s;
}
.pulse-station:hover { border-color: var(--line-strong); background: var(--bg-sub); }
.pulse-station .ps-bar { height: 3px; border-radius: 2px; background: var(--ok); }
.pulse-station.ok    .ps-bar { background: var(--ok); }
.pulse-station.warn  .ps-bar { background: var(--warning); }
.pulse-station.crit  .ps-bar { background: var(--critical); }
.pulse-station .ps-name { font-size: 12px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pulse-station .ps-stat { font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.pulse-station.crit .ps-stat { color: var(--critical); font-weight: 600; }
.pulse-station.warn .ps-stat { color: var(--warning); font-weight: 600; }

/* ── layouts ──────────────────────────────────────────── */
.cols-2 { display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
.cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.cols-detail { display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.stack-sm { display: flex; flex-direction: column; gap: 10px; }

/* ── cards ────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-head {
  padding: 13px 18px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  display: inline-flex; align-items: center; gap: 8px;
}
.card-title .count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  background: var(--bg-sub);
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--muted);
  font-weight: 500;
}
.card-title .count.urgent {
  background: var(--critical-soft);
  color: var(--critical);
}
.card-pad { padding: 16px 18px; }
.card-pad-lg { padding: 22px 24px; }

/* ── decision lanes (the heart of the dashboard) ──────── */
.lanes {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}
.lane {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.lane-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.lane-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.lane-tag .dot { width: 6px; height: 6px; border-radius: 50%; }
.lane-tag.triage  { color: var(--critical); }
.lane-tag.triage .dot { background: var(--critical); }
.lane-tag.approve { color: var(--warning); }
.lane-tag.approve .dot { background: var(--warning); }
.lane-tag.stuck   { color: var(--violet); }
.lane-tag.stuck .dot { background: var(--violet); }
.lane-title {
  display: flex; align-items: baseline; justify-content: space-between;
}
.lane-title .num { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.lane-title .num.zero { color: var(--muted-2); }
.lane-title .lbl { font-size: 13px; color: var(--muted); }
.lane-body { padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 2px; }

.lane-item {
  padding: 9px 10px;
  border-radius: 7px;
  cursor: pointer;
  display: flex; align-items: flex-start; gap: 10px;
  transition: background 0.12s;
}
.lane-item:hover { background: var(--bg-sub); }
.lane-item .li-code { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 2px; flex-shrink: 0; width: 78px; }
.lane-item .li-body { flex: 1; min-width: 0; }
.lane-item .li-title { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane-item .li-meta  { font-size: 11px; color: var(--muted); margin-top: 2px; }
.lane-empty {
  padding: 18px 14px;
  text-align: center;
  font-size: 12px;
  color: var(--muted-2);
  font-style: italic;
}

/* ── kpi tiles ────────────────────────────────────────── */
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
}
.kpi-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.kpi-value {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin-top: 4px;
  color: var(--ink);
}
.kpi-value .unit { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.kpi-sub .delta-up { color: var(--critical); }
.kpi-sub .delta-down { color: var(--ok); }

/* ── badges ───────────────────────────────────────────── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.badge .dot { width: 5px; height: 5px; border-radius: 50%; }
.badge-status-new       { background: #EFEDE6; color: #4B4943; }
.badge-status-new .dot  { background: #8B8576; }
.badge-status-progress  { background: var(--info-soft); color: var(--info); }
.badge-status-progress .dot { background: var(--info); }
.badge-status-pending   { background: var(--warning-soft); color: var(--warning); }
.badge-status-pending .dot { background: var(--warning); }
.badge-status-waiting   { background: var(--violet-soft); color: var(--violet); }
.badge-status-waiting .dot { background: var(--violet); }
.badge-status-maint     { background: #E0EFF7; color: #0E6BA8; }
.badge-status-maint .dot { background: #0E6BA8; }
.badge-status-closed    { background: var(--ok-soft); color: var(--ok); }
.badge-status-closed .dot { background: var(--ok); }
.badge-status-rejected  { background: var(--critical-soft); color: var(--critical); }
.badge-status-rejected .dot { background: var(--critical); }
.badge-status-duplicate { background: #EFEDE6; color: #71717A; }
.badge-status-duplicate .dot { background: #A19D90; }

.badge-prio-low      { background: var(--ok-soft); color: var(--ok); }
.badge-prio-medium   { background: var(--warning-soft); color: var(--warning); }
.badge-prio-high     { background: var(--critical-soft); color: var(--critical); }
.badge-prio-quotation{ background: var(--violet-soft); color: var(--violet); }

/* ── table ────────────────────────────────────────────── */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  padding: 9px 16px;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  white-space: nowrap;
}
.tbl td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  vertical-align: middle;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.clickable { cursor: pointer; transition: background 0.12s; }
.tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl .code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-2); font-weight: 500; }
.tbl .title-cell { font-weight: 500; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl .muted { color: var(--muted); }
.tbl .num { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

/* ── inputs ───────────────────────────────────────────── */
.input, .select, .textarea {
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--surface);
  font-size: 13px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.12s, box-shadow 0.12s;
  width: 100%;
  font-family: inherit;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(20,19,15,0.05);
}
.textarea { resize: vertical; min-height: 90px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.field-label .req { color: var(--critical); }
.field-hint { font-size: 11px; color: var(--muted); }

/* ── filters bar ──────────────────────────────────────── */
.filters {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
  align-items: center;
}
.filters .select { width: auto; min-width: 130px; }
.filters .input  { width: auto; min-width: 220px; }
.filters-count { margin-left: auto; font-size: 12px; color: var(--muted); }

/* ── tabs ─────────────────────────────────────────────── */
.tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.tab {
  padding: 9px 14px;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab .num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
.tab.active .num { color: var(--ink-2); }

/* ── ticket detail ────────────────────────────────────── */
.ticket-head {
  padding: 22px 24px;
  border-bottom: 1px solid var(--line);
}
.ticket-head .row1 {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.ticket-head .row1 .code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  background: var(--bg-sub);
  padding: 3px 8px;
  border-radius: 4px;
}
.ticket-head h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 28px;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin: 0 0 8px;
  line-height: 1.2;
}
.ticket-head .desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
  max-width: 680px;
}

.timeline {
  padding: 4px 18px 8px;
}
.timeline-item {
  display: flex; gap: 12px;
  padding: 10px 0;
  position: relative;
}
.timeline-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 9px; top: 26px; bottom: -4px;
  width: 1px;
  background: var(--line);
}
.timeline-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--line);
  flex-shrink: 0;
  display: grid; place-items: center;
  position: relative;
  z-index: 1;
  margin-top: 2px;
}
.timeline-dot.active { border-color: var(--ink); background: var(--ink); }
.timeline-dot.active::after {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.timeline-body { flex: 1; padding-top: 1px; }
.timeline-event { font-size: 13px; color: var(--ink); font-weight: 500; }
.timeline-detail { font-size: 12px; color: var(--muted); margin-top: 1px; }
.timeline-when { font-size: 11px; color: var(--muted-2); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }

/* ── meta rows ────────────────────────────────────────── */
.meta-list { padding: 4px 0 6px; }
.meta-row {
  padding: 8px 18px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px;
  gap: 10px;
}
.meta-row .label { color: var(--muted); font-size: 12px; }
.meta-row .val   { color: var(--ink); font-weight: 500; text-align: right; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta-row .val.code { font-family: 'IBM Plex Mono', monospace; }

/* ── cost block ───────────────────────────────────────── */
.cost-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 1px;
  background: var(--line);
  border-top: 1px solid var(--line);
}
.cost-grid > div {
  background: var(--surface);
  padding: 18px 22px;
}
.cost-grid > .total {
  background: var(--accent-soft);
}
.cost-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
.cost-val { font-size: 22px; font-weight: 600; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; letter-spacing: -0.01em; }
.cost-grid > .total .cost-val { color: var(--accent-ink); }
.cost-grid > .total .cost-label { color: var(--warning); font-weight: 600; }

/* ── branches grid ────────────────────────────────────── */
.branch-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.branch-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
  overflow: hidden;
}

  <script type="text/babel" data-presets="react">
// ── shared components ───────────────────────────────────
const { useState, useMemo, useEffect, useRef } = React;

// — utility helpers ───────────────────────────────────────
const fmtMoney = (n) => `EGP ${Math.round(n).toLocaleString()}`;
const fmtMoneyShort = (n) => {
  if (n >= 1_000_000) return `EGP ${(n/1_000_000).toFixed(1)}M`;
  if (n >= 1_000)     return `EGP ${(n/1_000).toFixed(1)}K`;
  return `EGP ${n}`;
};
const fmtDate = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
};
const fmtDateFull = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
};
const daysBetween = (a, b) => {
  if (!a) return 0;
  const end = b ? new Date(b) : new Date("2026-05-15");
  return Math.max(0, Math.round((end - new Date(a)) / 86400000));
};
const ticketCost = (t) => (Number(t.sparePartsCost)||0) + (Number(t.visitCost)||0);
const isOpen = (t) => !["Closed","Rejected","Duplicate"].includes(t.status);
const isOverdue = (t) => isOpen(t) && daysBetween(t.createdDate) >= 7;

// — Badge components ──────────────────────────────────────
function StatusBadge({ status }) {
  const cfg = STATUSES.find(s => s.key === status) || STATUSES[0];
  return (
    <span className={`badge ${cfg.cls}`}>
      <span className="dot"></span>
      {status}
    </span>
  );
}

function PrioBadge({ priority }) {
  const cfg = PRIORITIES.find(p => p.key === priority) || PRIORITIES[1];
  return <span className={`badge ${cfg.cls}`}>{priority}</span>;
}

// — Card scaffolding ──────────────────────────────────────
function Card({ children, className = "" }) {
  return <div className={`card ${className}`}>{children}</div>;
}

function CardHead({ title, count, urgent, action, icon }) {
  return (
    <div className="card-head">
      <div className="card-title">
        {icon && <i className={`ti ${icon}`} style={{ color: "var(--muted)" }}></i>}
        {title}
        {count !== undefined && <span className={`count ${urgent ? "urgent" : ""}`}>{count}</span>}
      </div>
      {action}
    </div>
  );
}

// — Pulse strip (branches as health-coloured chips) ───────
function PulseStrip({ branches, tickets, onBranchClick }) {
  const stations = branches.filter(b => b.type === "Amazon Now Station");
  return (
    <div className="pulse">
      <div className="pulse-label">
        <span className="live-dot"></span>
        Live · {stations.length} stations
      </div>
      <div className="pulse-stations">
        {stations.map(b => {
          const open = tickets.filter(t => t.branchId === b.id && isOpen(t));
          const crit = open.filter(t => t.priority === "High").length;
          const cls  = crit > 0 ? "crit" : open.length > 0 ? "warn" : "ok";
          return (
            <div key={b.id} className={`pulse-station ${cls}`} onClick={() => onBranchClick(b.id)} title={b.name}>
              <div className="ps-bar"></div>
              <div className="ps-name">{b.name}</div>
              <div className="ps-stat">
                {open.length === 0 ? "all clear" : `${open.length} open${crit > 0 ? ` · ${crit} hi` : ""}`}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// — Lane item (used in decision inbox) ────────────────────
function LaneItem({ ticket, branch, onClick }) {
  return (
    <div className="lane-item" onClick={() => onClick(ticket)}>
      <div className="li-code mono">{ticket.code.replace("ANW-26-", "")}</div>
      <div className="li-body">
        <div className="li-title">{ticket.title}</div>
        <div className="li-meta">
          {branch?.name || "—"} · {ticket.category} · {daysBetween(ticket.createdDate)}d
        </div>
      </div>
    </div>
  );
}

// — KPI tile ──────────────────────────────────────────────
function Kpi({ label, value, unit, sub, delta }) {
  return (
    <div className="kpi">
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">
        {value}
        {unit && <span className="unit">{unit}</span>}
      </div>
      {sub && <div className="kpi-sub">{sub}</div>}
      {delta && (
        <div className="kpi-sub">
          <span className={delta.dir === "up" ? "delta-up" : "delta-down"}>
            <i className={`ti ti-${delta.dir === "up" ? "trending-up" : "trending-down"}`}></i>
            {delta.value}
          </span>
          <span>{delta.label}</span>
        </div>
      )}
    </div>
  );
}

// — vendor grade calculator ───────────────────────────────
function vendorScore(vendor, allTickets) {
  const ts = allTickets.filter(t => t.vendorId === vendor.id);
  const closed = ts.filter(t => t.status === "Closed");
  const avg = closed.length ? closed.reduce((s, t) => s + daysBetween(t.createdDate, t.closedDate), 0) / closed.length : 0;
  const spend = ts.reduce((s, t) => s + ticketCost(t), 0);
  // simple grade: A < 4d avg, B < 7, C < 12, D >=12
  let grade = "—";
  if (closed.length === 0) grade = "—";
  else if (avg < 4)  grade = "A";
  else if (avg < 7)  grade = "B";
  else if (avg < 12) grade = "C";
  else               grade = "D";
  return { tickets: ts.length, closed: closed.length, avg: Math.round(avg * 10) / 10, spend, grade };
}

// — Group-by helper for Reports view ──────────────────────
// Returns: [{ key, label, count, spend, avgDays, openCount, breakdown? }, ...]
function groupTickets(tickets, dimension, lookups) {
  const { branchById, vendorById, agentById } = lookups;
  const map = new Map();
  const keyOf = (t) => {
    switch (dimension) {
      case "branch":   return [t.branchId, branchById[t.branchId]?.name || "—"];
      case "zone":     return [branchById[t.branchId]?.zone || "—", branchById[t.branchId]?.zone || "—"];
      case "category": return [t.category, t.category];
      case "vendor":   return [t.vendorId || 0, vendorById[t.vendorId]?.name || "Unassigned"];
      case "agent":    return [t.agentId  || 0, agentById[t.agentId]?.name  || "Unassigned"];
      case "status":   return [t.status, t.status];
      case "priority": return [t.priority, t.priority];
      case "maint":    return [t.maintenanceType, t.maintenanceType];
      case "month":    {
        const m = (t.createdDate || "").slice(0, 7);
        return [m, m];
      }
      default: return ["—","—"];
    }
  };
  for (const t of tickets) {
    const [key, label] = keyOf(t);
    if (!map.has(key)) map.set(key, { key, label, count: 0, spend: 0, days: 0, closedCount: 0, openCount: 0 });
    const row = map.get(key);
    row.count += 1;
    row.spend += ticketCost(t);
    if (t.status === "Closed") {
      row.closedCount += 1;
      row.days += daysBetween(t.createdDate, t.closedDate);
    }
    if (isOpen(t)) row.openCount += 1;
  }
  const rows = Array.from(map.values()).map(r => ({
    ...r,
    avgDays: r.closedCount ? Math.round((r.days / r.closedCount) * 10) / 10 : null,
  }));
  return rows.sort((a, b) => b.spend - a.spend || b.count - a.count);
}

// Expose
Object.assign(window, {
  fmtMoney, fmtMoneyShort, fmtDate, fmtDateFull, daysBetween, ticketCost, isOpen, isOverdue,
  StatusBadge, PrioBadge, Card, CardHead, PulseStrip, LaneItem, Kpi, vendorScore, groupTickets,
});

</script>

  const branchById = useMemo(() => Object.fromEntries(branches.map(b => [b.id, b])), [branches]);

  const agentById  = useMemo(() => Object.fromEntries(agents.map(a => [a.id, a])), [agents]);

  let filtered = tickets;
  if (tab === "open")   filtered = filtered.filter(isOpen);
  if (tab === "closed") filtered = filtered.filter(t => t.status === "Closed");
  if (tab === "mine")   filtered = filtered.filter(t => t.agentId === 1); // M. Khalifa as "me"
  if (filters.status)   filtered = filtered.filter(t => t.status === filters.status);
  if (filters.branchId) filtered = filtered.filter(t => t.branchId === Number(filters.branchId));
  if (filters.category) filtered = filtered.filter(t => t.category === filters.category);
  if (filters.priority) filtered = filtered.filter(t => t.priority === filters.priority);
  if (filters.vendorId) filtered = filtered.filter(t => t.vendorId === Number(filters.vendorId));
  if (filters.search) {
    const q = filters.search.toLowerCase();
    filtered = filtered.filter(t => t.title.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
  }

  const counts = {
    all:    tickets.length,
    open:   tickets.filter(isOpen).length,
    mine:   tickets.filter(t => t.agentId === 1).length,
    closed: tickets.filter(t => t.status === "Closed").length,
  };

  return (
    <div className="canvas-inner">
      <div className="tabs">
        {[["all","All"],["open","Open"],["mine","Assigned to me"],["closed","Closed"]].map(([k,l]) => (
          <div key={k} className={`tab ${tab===k?"active":""}`} onClick={() => setTab(k)}>
            {l} <span className="num">{counts[k]}</span>
          </div>
        ))}
        <div style={{ marginLeft: "auto", display: "flex", gap: 8, alignItems: "center", paddingBottom: 6 }}>
          <button className="btn btn-accent btn-sm" onClick={onNewTicket}>
            <i className="ti ti-plus"></i> New ticket
          </button>
        </div>
      </div>

      <div className="filters">
        <input className="input" placeholder="Search title or code…" value={filters.search} onChange={e => setFilters(f => ({ ...f, search: e.target.value }))} />
        <select className="select" value={filters.status} onChange={e => setFilters(f => ({ ...f, status: e.target.value }))}>
          <option value="">All statuses</option>
          {STATUSES.map(s => <option key={s.key}>{s.key}</option>)}
        </select>
        <select className="select" value={filters.branchId} onChange={e => setFilters(f => ({ ...f, branchId: e.target.value }))}>
          <option value="">All branches</option>
          {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
        <select className="select" value={filters.category} onChange={e => setFilters(f => ({ ...f, category: e.target.value }))}>
          <option value="">All categories</option>
          {Object.keys(CATEGORIES).map(c => <option key={c}>{c}</option>)}
        </select>
        <select className="select" value={filters.priority} onChange={e => setFilters(f => ({ ...f, priority: e.target.value }))}>
          <option value="">All priorities</option>
          {PRIORITIES.map(p => <option key={p.key}>{p.key}</option>)}
        </select>
        <select className="select" value={filters.vendorId} onChange={e => setFilters(f => ({ ...f, vendorId: e.target.value }))}>
          <option value="">All vendors</option>
          {vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
        </select>
        {Object.values(filters).some(Boolean) && (
          <button className="btn btn-sm btn-ghost" onClick={() => setFilters({ search: "", status: "", branchId: "", category: "", priority: "", vendorId: "" })}>
            <i className="ti ti-x"></i> Clear
          </button>
        )}
        <span className="filters-count">{filtered.length} of {tickets.length}</span>
      </div>

      <Card>
        <table className="tbl">
          <thead><tr>
            <th>Code</th>
            <th>Title</th>
            <th>Branch</th>
            <th>Category</th>
            <th>Vendor</th>
            <th>Status</th>
            <th>Priority</th>
            <th style={{ textAlign: "right" }}>Cost</th>
            <th style={{ textAlign: "right" }}>Age</th>
          </tr></thead>
          <tbody>
            {filtered.length === 0 ? (
              <tr><td colSpan={9}><div className="empty"><i className="ti ti-search-off"></i><p>No tickets match these filters.</p></div></td></tr>
            ) : filtered.map(t => (
              <tr key={t.id} className="clickable" onClick={() => onOpenTicket(t)}>
                <td><span className="code">{t.code}</span></td>
                <td><div className="title-cell">{t.title}</div></td>
                <td className="muted" style={{ maxWidth: 160, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{branchById[t.branchId]?.name}</td>
                <td className="muted">{t.category}</td>
                <td className="muted">{vendorById[t.vendorId]?.name || "—"}</td>
                <td><StatusBadge status={t.status} /></td>
                <td><PrioBadge priority={t.priority} /></td>
                <td className="num" style={{ textAlign: "right" }}>{ticketCost(t) ? fmtMoney(ticketCost(t)) : "—"}</td>
                <td className="num muted" style={{ textAlign: "right" }}>{daysBetween(t.createdDate, t.closedDate)}d</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>
    </div>
  );
}

// ============================================================================
// TICKET DETAIL
// ============================================================================
function TicketDetail({ ticket, branches, vendors, agents, onUpdate }) {
  const branch = branches.find(b => b.id === ticket.branchId);
  const vendor = vendors.find(v => v.id === ticket.vendorId);
  const agent  = agents.find(a => a.id === ticket.agentId);

  // synthetic timeline
  const events = [
    { event: "Reported", detail: `By ${ticket.reporter}`, when: ticket.createdDate },
    ticket.agentId ? { event: "Agent assigned", detail: `${agent?.name || "—"} took ownership`, when: ticket.createdDate } : null,
    ticket.vendorId ? { event: "Vendor dispatched", detail: `${vendor?.name || "—"} notified`, when: ticket.createdDate } : null,
    ticket.status === "In Maintenance" ? { event: "Vendor on-site", detail: "Repair in progress", when: ticket.createdDate, active: true } : null,
    ticket.status === "Waiting Approval" ? { event: "Awaiting approval", detail: `${fmtMoney(ticketCost(ticket))} needs sign-off`, when: ticket.createdDate, active: true } : null,
    ticket.status === "Pending" ? { event: "Blocked", detail: "Waiting for parts / info", when: ticket.createdDate, active: true } : null,
    ticket.closedDate ? { event: "Closed", detail: "Signed off & resolved", when: ticket.closedDate, active: true } : null,
  ].filter(Boolean);

  return (
    <div className="canvas-inner">
      <div className="cols-detail">
        <div className="stack">
          <Card>
            <div className="ticket-head">
              <div className="row1">
                <span className="code">{ticket.code}</span>
                <StatusBadge status={ticket.status} />
                <PrioBadge priority={ticket.priority} />
                <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--muted)" }}>
                  {fmtDateFull(ticket.createdDate)} · {daysBetween(ticket.createdDate, ticket.closedDate)} days
                </span>
              </div>
              <h1>{ticket.title}</h1>
              <p className="desc">{ticket.description || <em>No description provided.</em>}</p>
            </div>

            <div className="cost-grid">
              <div>
                <div className="cost-label">Spare parts</div>
                <div className="cost-val">{fmtMoney(ticket.sparePartsCost || 0)}</div>
              </div>
              <div>
                <div className="cost-label">Visit</div>
                <div className="cost-val">{fmtMoney(ticket.visitCost || 0)}</div>
              </div>
              <div className="total">
                <div className="cost-label">Total</div>
                <div className="cost-val">{fmtMoney(ticketCost(ticket))}</div>
              </div>
            </div>
          </Card>

          <Card>
            <CardHead title="Activity timeline" icon="ti-timeline" />
            <div className="timeline">
              {events.map((e, i) => (
                <div key={i} className="timeline-item">
                  <div className={`timeline-dot ${e.active ? "active" : ""}`}></div>
                  <div className="timeline-body">
                    <div className="timeline-event">{e.event}</div>
                    <div className="timeline-detail">{e.detail}</div>
                    <div className="timeline-when">{fmtDateFull(e.when)}</div>
                  </div>
                </div>
              ))}
            </div>
          </Card>
        </div>

        <div className="stack">
          <Card>
            <CardHead title="Update status" />
            <div style={{ padding: 16 }}>
              <select className="select" value={ticket.status} onChange={e => onUpdate({ ...ticket, status: e.target.value, closedDate: ["Closed","Rejected"].includes(e.target.value) ? new Date("2026-05-15").toISOString().split("T")[0] : ticket.closedDate })}>
                {STATUSES.map(s => <option key={s.key}>{s.key}</option>)}
              </select>
              <p style={{ fontSize: 11, color: "var(--muted)", marginTop: 10, lineHeight: 1.5 }}>
                {STATUSES.find(s => s.key === ticket.status)?.desc}
              </p>
            </div>
          </Card>

          <Card>
            <CardHead title="Details" />
            <div className="meta-list">
              <div className="meta-row"><span className="label">Branch</span><span className="val">{branch?.name || "—"}</span></div>
              <div className="meta-row"><span className="label">Zone</span><span className="val">{branch?.zone || "—"}</span></div>
              <div className="meta-row"><span className="label">Type</span><span className="val">{branch?.type || "—"}</span></div>
              <div className="meta-row"><span className="label">Category</span><span className="val">{ticket.category} · {ticket.ticketType}</span></div>
              <div className="meta-row"><span className="label">Maintenance</span><span className="val">{ticket.maintenanceType}</span></div>
              <div className="meta-row"><span className="label">Reporter</span><span className="val">{ticket.reporter}</span></div>
              <div className="meta-row"><span className="label">Assigned agent</span><span className="val">{agent?.name || "Unassigned"}</span></div>
              <div className="meta-row"><span className="label">Vendor</span><span className="val">{vendor?.name || "Unassigned"}</span></div>
              <div className="meta-row"><span className="label">Created</span><span className="val">{fmtDateFull(ticket.createdDate)}</span></div>
              <div className="meta-row"><span className="label">Closed</span><span className="val">{fmtDateFull(ticket.closedDate)}</span></div>
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

    <div className="canvas-inner" style={{ maxWidth: 820 }}>
      <div className="fast-form">
        {err && <div style={{ background: "var(--critical-soft)", color: "var(--critical)", padding: "10px 14px", borderRadius: 7, fontSize: 13, marginBottom: 16 }}>{err}</div>}

          <h3>What broke?</h3>

            <textarea className="textarea" placeholder="Add detail: where exactly, urgency, what's been tried…" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} />

            <span className="field-label">Branch <span className="req">*</span></span>
            <select className="select" value={form.branchId} onChange={e => setForm(f => ({ ...f, branchId: e.target.value }))}>
              <option value="">Pick a branch…</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name} · {b.zone}</option>)}

          </div>

                  <i className={`ti ${CATEGORIES[c].icon}`} style={{ marginRight: 4 }}></i>
                  {c}

          </div>

          <div className="field" style={{ marginBottom: 14 }}>

          <div className="field">
            <span className="field-label">Priority</span>
            <div className="chip-row">
              {PRIORITIES.map(p => (
                <button key={p.key} className={`chip ${form.priority === p.key ? "active" : ""}`} onClick={() => setForm(f => ({ ...f, priority: p.key }))}>{p.key}</button>
              ))}
            </div>
          </div>
        </div>

        <div className="step">
          <div className="step-num">STEP 03 / 03 · optional</div>
          <h3>Triage now or later?</h3>
          <p style={{ fontSize: 12, color: "var(--muted)", marginBottom: 14 }}>You can assign and cost later from the ticket page.</p>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14, marginBottom: 14 }}>
            <div className="field">
              <span className="field-label">Agent</span>
              <select className="select" value={form.agentId} onChange={e => setForm(f => ({ ...f, agentId: e.target.value }))}>
                <option value="">Unassigned</option>
                {agents.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
            <div className="field">
              <span className="field-label">Vendor</span>
              <select className="select" value={form.vendorId} onChange={e => setForm(f => ({ ...f, vendorId: e.target.value }))}>

              </select>
            </div>
            <div className="field">
              <span className="field-label">Spare parts (EGP)</span>
              <input className="input" type="number" placeholder="0" value={form.sparePartsCost} onChange={e => setForm(f => ({ ...f, sparePartsCost: e.target.value }))} />

              <span className="field-label">Visit (EGP)</span>

// ============================================================================
// BRANCHES — grid + detail
// ============================================================================
function BranchesView({ branches, tickets, onOpenBranch }) {
  const [zone, setZone] = useState("");
  const [type, setType] = useState("");
  const [search, setSearch] = useState("");

  const zones = [...new Set(branches.map(b => b.zone))];
  const types = [...new Set(branches.map(b => b.type))];

  let filtered = branches;
  if (zone)   filtered = filtered.filter(b => b.zone === zone);
  if (type)   filtered = filtered.filter(b => b.type === type);
  if (search) filtered = filtered.filter(b => b.name.toLowerCase().includes(search.toLowerCase()) || b.code.toLowerCase().includes(search.toLowerCase()));

  return (
    <div className="canvas-inner">
      <div className="filters">
        <input className="input" placeholder="Search branch…" value={search} onChange={e => setSearch(e.target.value)} />
        <select className="select" value={zone} onChange={e => setZone(e.target.value)}>
          <option value="">All zones</option>
          {zones.map(z => <option key={z}>{z}</option>)}
        </select>
        <select className="select" value={type} onChange={e => setType(e.target.value)}>
          <option value="">All types</option>
          {types.map(t => <option key={t}>{t}</option>)}
        </select>
        <span className="filters-count">{filtered.length} branches</span>
      </div>

      <div className="branch-grid">
        {filtered.map(b => {
          const open = tickets.filter(t => t.branchId === b.id && isOpen(t));
          const crit = open.filter(t => t.priority === "High").length;
          const spend = tickets.filter(t => t.branchId === b.id).reduce((s,t) => s + ticketCost(t), 0);
          const ttlTickets = tickets.filter(t => t.branchId === b.id).length;
          const health = crit > 0 ? "crit" : open.length > 0 ? "warn" : "ok";
          return (
            <div key={b.id} className="branch-card" onClick={() => onOpenBranch(b.id)}>
              <div className={`health-strip ${health}`}></div>
              <div className="b-zone">{b.zone}</div>
              <h3>{b.name}</h3>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: -8, marginBottom: 6 }}>
                <span className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{b.code}</span>
                <span style={{ fontSize: 11, color: "var(--muted)" }}>· {b.type}</span>
              </div>
              <div className="b-stats">
                <div>
                  <div className="b-stat-l">Open</div>
                  <div className={`b-stat-v ${open.length === 0 ? "zero" : crit > 0 ? "crit" : "warn"}`}>{open.length}</div>
                </div>
                <div>
                  <div className="b-stat-l">High prio</div>
                  <div className={`b-stat-v ${crit > 0 ? "crit" : "zero"}`}>{crit}</div>
                </div>
                <div>
                  <div className="b-stat-l">All-time</div>
                  <div className="b-stat-v">{ttlTickets}</div>
                </div>
                <div>
                  <div className="b-stat-l">Total spend</div>
                  <div className="b-stat-v" style={{ fontSize: 13 }}>{fmtMoneyShort(spend)}</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BranchDetail({ branch, tickets, vendors, agents, branches, onOpenTicket }) {
  const branchTickets = tickets.filter(t => t.branchId === branch.id);
  const open = branchTickets.filter(isOpen);
  const closed = branchTickets.filter(t => t.status === "Closed");
  const totalSpend = branchTickets.reduce((s,t) => s + ticketCost(t), 0);
  const avgClose = closed.length ? Math.round((closed.reduce((s,t) => s + daysBetween(t.createdDate, t.closedDate), 0) / closed.length) * 10) / 10 : 0;

  // breakdown by category
  const byCategory = Object.keys(CATEGORIES).map(c => ({
    category: c,
    count: branchTickets.filter(t => t.category === c).length,
    spend: branchTickets.filter(t => t.category === c).reduce((s,t) => s + ticketCost(t), 0),
  })).filter(c => c.count > 0).sort((a,b) => b.spend - a.spend);

  return (
    <div className="canvas-inner">
      <div style={{ marginBottom: 22 }}>
        <div className="section-eyebrow">{branch.zone} · {branch.type}</div>
        <h1 style={{ fontFamily: "'Instrument Serif', serif", fontSize: 36, fontWeight: 400, letterSpacing: "-0.01em", margin: "4px 0 4px" }}>{branch.name}</h1>
        <div style={{ fontSize: 13, color: "var(--muted)" }}>
          <span className="mono">{branch.code}</span> · {branch.sqm} m² · Manager: {branch.manager} · Opened {fmtDateFull(branch.openedAt)}
        </div>
      </div>

      <div className="cols-4" style={{ marginBottom: 22 }}>
        <Kpi label="Open tickets" value={open.length} sub={open.length === 0 ? "all clear" : `${open.filter(t => t.priority === "High").length} high prio`} />
        <Kpi label="All-time tickets" value={branchTickets.length} sub={`${closed.length} closed`} />
        <Kpi label="Total spend" value={fmtMoneyShort(totalSpend)} sub="parts + visits" />
        <Kpi label="Avg time to close" value={avgClose} unit="days" sub={`from ${closed.length} closed`} />
      </div>

      <div className="cols-2">
        <Card>
          <CardHead title="All tickets" count={branchTickets.length} />
          <table className="tbl">
            <thead><tr>
              <th>Code</th><th>Title</th><th>Status</th><th>Priority</th><th style={{ textAlign: "right" }}>Cost</th>
            </tr></thead>
            <tbody>
              {branchTickets.map(t => (
                <tr key={t.id} className="clickable" onClick={() => onOpenTicket(t)}>
                  <td><span className="code">{t.code}</span></td>
                  <td><div className="title-cell">{t.title}</div></td>
                  <td><StatusBadge status={t.status} /></td>
                  <td><PrioBadge priority={t.priority} /></td>
                  <td className="num" style={{ textAlign: "right" }}>{ticketCost(t) ? fmtMoney(ticketCost(t)) : "—"}</td>
                </tr>
              ))}
              {branchTickets.length === 0 && <tr><td colSpan={5}><div className="empty"><i className="ti ti-checkbox"></i><p>No tickets recorded for this branch yet.</p></div></td></tr>}
            </tbody>
          </table>
        </Card>

        <div className="stack">
          <Card>
            <CardHead title="Spend by category" />
            <div style={{ padding: "10px 0" }}>
              {byCategory.length === 0 && <div className="lane-empty">No spend yet.</div>}
              {byCategory.map(c => {
                const max = Math.max(...byCategory.map(x => x.spend));
                return (
                  <div key={c.category} style={{ padding: "8px 18px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 4 }}>
                      <span><i className={`ti ${CATEGORIES[c.category].icon}`} style={{ color: "var(--muted)", marginRight: 6 }}></i>{c.category}</span>
                      <span className="mono" style={{ color: "var(--ink-2)" }}>{fmtMoneyShort(c.spend)}</span>
                    </div>
                    <div style={{ height: 3, background: "var(--bg-sub)", borderRadius: 2, overflow: "hidden" }}>
                      <div style={{ width: `${(c.spend/max)*100}%`, height: "100%", background: "var(--ink)" }}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

// VENDORS — scorecard
// ============================================================================
function VendorsView({ vendors, tickets, branches }) {
  const rows = vendors.map(v => ({ vendor: v, ...vendorScore(v, tickets) })).sort((a,b) => b.spend - a.spend);
  const maxSpend = Math.max(...rows.map(r => r.spend), 1);
  const totalSpend = rows.reduce((s,r) => s + r.spend, 0);

  return (
    <div className="canvas-inner">
      <div style={{ marginBottom: 22 }}>
        <div className="section-eyebrow">Vendor performance</div>
        <h1 className="section-title">{vendors.length} active vendors · {fmtMoneyShort(totalSpend)} all-time</h1>
      </div>

      <Card>

// ============================================================================
// REPORTS — group-by breakdown with filters (★ the one user asked for)
// ============================================================================
function ReportsView({ tickets, branches, vendors, agents }) {
  const [groupBy, setGroupBy] = useState("branch");
  const [metric, setMetric]   = useState("spend"); // spend | count | avgDays
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo,   setDateTo]   = useState("");
  const [filters, setFilters] = useState({ status: "", branchId: "", category: "", priority: "", vendorId: "", zone: "", maintenanceType: "" });

  const branchById = useMemo(() => Object.fromEntries(branches.map(b => [b.id, b])), [branches]);
  const vendorById = useMemo(() => Object.fromEntries(vendors.map(v => [v.id, v])), [vendors]);
  const agentById  = useMemo(() => Object.fromEntries(agents.map(a => [a.id, a])), [agents]);

  // apply filters
  let scoped = tickets;
  if (dateFrom) scoped = scoped.filter(t => t.createdDate >= dateFrom);
  if (dateTo)   scoped = scoped.filter(t => t.createdDate <= dateTo);
  if (filters.status)          scoped = scoped.filter(t => t.status === filters.status);
  if (filters.branchId)        scoped = scoped.filter(t => t.branchId === Number(filters.branchId));
  if (filters.category)        scoped = scoped.filter(t => t.category === filters.category);
  if (filters.priority)        scoped = scoped.filter(t => t.priority === filters.priority);
  if (filters.vendorId)        scoped = scoped.filter(t => t.vendorId === Number(filters.vendorId));
  if (filters.zone)            scoped = scoped.filter(t => branchById[t.branchId]?.zone === filters.zone);
  if (filters.maintenanceType) scoped = scoped.filter(t => t.maintenanceType === filters.maintenanceType);

  const rows = groupTickets(scoped, groupBy, { branchById, vendorById, agentById });

  // sort by chosen metric
  rows.sort((a, b) => {
    if (metric === "spend")   return b.spend - a.spend;
    if (metric === "count")   return b.count - a.count;
    if (metric === "avgDays") return (b.avgDays ?? -1) - (a.avgDays ?? -1);
    return 0;
  });

  const totals = {
    count: scoped.length,
    spend: scoped.reduce((s,t) => s + ticketCost(t), 0),
    open:  scoped.filter(isOpen).length,
    closed:scoped.filter(t => t.status === "Closed").length,
  };
  const maxValue = Math.max(
    ...rows.map(r => metric === "spend" ? r.spend : metric === "count" ? r.count : r.avgDays || 0),
    1
  );

  const zones = [...new Set(branches.map(b => b.zone))];

  const exportCsv = () => {
    const head = [`Group by: ${groupBy}`, "label", "count", "openCount", "closedCount", "spend (EGP)", "avgDays"].join(",");
    const lines = rows.map(r => [
      "", JSON.stringify(r.label), r.count, r.openCount, r.closedCount, r.spend, r.avgDays ?? ""
    ].join(","));
    const csv = [head, ...lines].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `report-${groupBy}-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const groupLabels = {
    branch:   "Branch",
    zone:     "Zone",
    category: "Category",
    vendor:   "Vendor",
    agent:    "Agent",
    status:   "Status",
    priority: "Priority",
    maint:    "Maintenance type",
    month:    "Month",
  };

  return (
    <div className="canvas-inner">
      <div style={{ marginBottom: 18 }}>
        <div className="section-eyebrow">Reports</div>
        <h1 className="section-title">Breakdown · group by {groupLabels[groupBy].toLowerCase()}</h1>
      </div>

      {/* Group-by selector */}
      <Card>
        <div style={{ padding: "14px 18px", display: "flex", gap: 18, alignItems: "center", borderBottom: "1px solid var(--line)", flexWrap: "wrap" }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.08em", color: "var(--muted)", textTransform: "uppercase" }}>Group by</span>
            <div className="chip-row">
              {Object.entries(groupLabels).map(([k, l]) => (
                <button key={k} className={`chip ${groupBy === k ? "active" : ""}`} onClick={() => setGroupBy(k)}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ height: 36, width: 1, background: "var(--line)" }}></div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.08em", color: "var(--muted)", textTransform: "uppercase" }}>Sort by</span>
            <div className="chip-row">
              {[["spend","Spend"],["count","Ticket count"],["avgDays","Avg time to close"]].map(([k,l]) => (
                <button key={k} className={`chip ${metric === k ? "active" : ""}`} onClick={() => setMetric(k)}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{ marginLeft: "auto" }}>
            <button className="btn btn-sm" onClick={exportCsv}><i className="ti ti-download"></i> Export CSV</button>
          </div>
        </div>

        {/* Filters */}
        <div style={{ padding: "12px 18px", borderBottom: "1px solid var(--line)", background: "var(--surface-2)" }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.08em", marginRight: 4 }}>Filters</span>

            <input type="date" className="select" style={{ width: "auto" }} value={dateFrom} onChange={e => setDateFrom(e.target.value)} title="From date" />
            <span style={{ color: "var(--muted)" }}>→</span>
            <input type="date" className="select" style={{ width: "auto" }} value={dateTo} onChange={e => setDateTo(e.target.value)} title="To date" />

            <select className="select" style={{ width: "auto" }} value={filters.zone} onChange={e => setFilters(f => ({ ...f, zone: e.target.value }))}>
              <option value="">All zones</option>
              {zones.map(z => <option key={z}>{z}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.branchId} onChange={e => setFilters(f => ({ ...f, branchId: e.target.value }))}>
              <option value="">All branches</option>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.category} onChange={e => setFilters(f => ({ ...f, category: e.target.value }))}>
              <option value="">All categories</option>
              {Object.keys(CATEGORIES).map(c => <option key={c}>{c}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.vendorId} onChange={e => setFilters(f => ({ ...f, vendorId: e.target.value }))}>
              <option value="">All vendors</option>
              {vendors.map(v => <option key={v.id} value={v.id}>{v.name}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.status} onChange={e => setFilters(f => ({ ...f, status: e.target.value }))}>
              <option value="">All statuses</option>
              {STATUSES.map(s => <option key={s.key}>{s.key}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.priority} onChange={e => setFilters(f => ({ ...f, priority: e.target.value }))}>
              <option value="">All priorities</option>
              {PRIORITIES.map(p => <option key={p.key}>{p.key}</option>)}
            </select>
            <select className="select" style={{ width: "auto" }} value={filters.maintenanceType} onChange={e => setFilters(f => ({ ...f, maintenanceType: e.target.value }))}>
              <option value="">All maint. types</option>
              {MAINT_TYPES.map(m => <option key={m}>{m}</option>)}
            </select>

            {(Object.values(filters).some(Boolean) || dateFrom || dateTo) && (
              <button className="btn btn-sm btn-ghost" onClick={() => { setFilters({ status: "", branchId: "", category: "", priority: "", vendorId: "", zone: "", maintenanceType: "" }); setDateFrom(""); setDateTo(""); }}>
                <i className="ti ti-x"></i> Clear
              </button>
            )}
          </div>
        </div>

        {/* Totals strip */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", borderBottom: "1px solid var(--line)" }}>
          {[
            { l: "Tickets in scope", v: totals.count, mono: false },
            { l: "Open",  v: totals.open, mono: false },
            { l: "Closed", v: totals.closed, mono: false },
            { l: "Total spend", v: fmtMoneyShort(totals.spend), mono: true, accent: true },
          ].map((s, i) => (
            <div key={i} style={{ padding: "14px 18px", borderRight: i < 3 ? "1px solid var(--line)" : "none", background: s.accent ? "var(--accent-soft)" : "transparent" }}>
              <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.08em", color: "var(--muted)", textTransform: "uppercase" }}>{s.l}</div>
              <div className="mono" style={{ fontSize: 20, fontWeight: 600, marginTop: 4, color: s.accent ? "var(--accent-ink)" : "var(--ink)" }}>{s.v}</div>
            </div>
          ))}
        </div>

        {/* Breakdown rows */}
        <table className="tbl">
          <thead><tr>
            <th style={{ width: "30%" }}>{groupLabels[groupBy]}</th>
            <th>Share</th>
            <th style={{ textAlign: "right" }}>Tickets</th>
            <th style={{ textAlign: "right" }}>Open</th>
            <th style={{ textAlign: "right" }}>Closed</th>
            <th style={{ textAlign: "right" }}>Avg close</th>
            <th style={{ textAlign: "right" }}>Spend</th>
          </tr></thead>
          <tbody>
            {rows.length === 0 ? (
              <tr><td colSpan={7}><div className="empty"><i className="ti ti-chart-bar"></i><p>No data matches your filters.</p></div></td></tr>
            ) : rows.map(r => {
              const val = metric === "spend" ? r.spend : metric === "count" ? r.count : (r.avgDays || 0);
              const pct = (val / maxValue) * 100;
              return (
                <tr key={r.key}>
                  <td style={{ fontWeight: 500 }}>{r.label}</td>
                  <td>
                    <div style={{ height: 6, background: "var(--bg-sub)", borderRadius: 3, overflow: "hidden", minWidth: 120 }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: metric === "spend" ? "var(--accent)" : "var(--ink)" }}></div>
                    </div>
                  </td>
                  <td className="num" style={{ textAlign: "right" }}>{r.count}</td>
                  <td className="num" style={{ textAlign: "right", color: r.openCount ? "var(--warning)" : "var(--muted)" }}>{r.openCount}</td>
                  <td className="num muted" style={{ textAlign: "right" }}>{r.closedCount}</td>
                  <td className="num muted" style={{ textAlign: "right" }}>{r.avgDays !== null ? `${r.avgDays}d` : "—"}</td>
                  <td className="num" style={{ textAlign: "right", fontWeight: 600 }}>{fmtMoney(r.spend)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </Card>

      <div style={{ marginTop: 28 }}>
        <div className="section-eyebrow">Cross-tab</div>
        <h2 className="section-title">{groupLabels[groupBy]} × Category</h2>
        <CrossTab rows={rows.slice(0, 8)} tickets={scoped} groupBy={groupBy} branchById={branchById} vendorById={vendorById} agentById={agentById} />
      </div>
    </div>
  );
}

// Cross-tab table: rows = top groups, columns = categories
function CrossTab({ rows, tickets, groupBy, branchById, vendorById, agentById }) {
  const cats = Object.keys(CATEGORIES);
  const keyOf = (t) => {
    switch (groupBy) {
      case "branch":   return t.branchId;
      case "zone":     return branchById[t.branchId]?.zone;
      case "category": return t.category;
      case "vendor":   return t.vendorId || 0;
      case "agent":    return t.agentId || 0;
      case "status":   return t.status;
      case "priority": return t.priority;
      case "maint":    return t.maintenanceType;
      case "month":    return (t.createdDate || "").slice(0,7);
      default:         return null;
    }
  };

  const cell = (rowKey, cat) => tickets.filter(t => keyOf(t) === rowKey && t.category === cat).reduce((s,t) => s + ticketCost(t), 0);

  const maxCell = Math.max(...rows.flatMap(r => cats.map(c => cell(r.key, c))), 1);

  return (
    <Card>
      <table className="tbl" style={{ tableLayout: "fixed" }}>
        <thead><tr>
          <th style={{ width: 180 }}>{groupBy === "branch" ? "Branch" : groupBy}</th>
          {cats.map(c => <th key={c} style={{ textAlign: "right", fontSize: 9 }} title={c}>{c.split(" ")[0]}</th>)}
          <th style={{ textAlign: "right" }}>Total</th>
        </tr></thead>
        <tbody>
          {rows.map(r => {
            const total = cats.reduce((s,c) => s + cell(r.key, c), 0);
            return (
              <tr key={r.key}>
                <td style={{ fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.label}</td>
                {cats.map(c => {
                  const v = cell(r.key, c);
                  const intensity = v / maxCell;
                  return (
                    <td key={c} style={{ textAlign: "right", background: v > 0 ? `rgba(255,153,0,${0.08 + intensity * 0.45})` : "transparent" }}>
                      <span className="mono" style={{ fontSize: 11, color: v > 0 ? "var(--ink)" : "var(--muted-2)" }}>
                        {v > 0 ? fmtMoneyShort(v).replace("EGP ", "") : "·"}
                      </span>
                    </td>
                  );
                })}
                <td className="num" style={{ textAlign: "right", fontWeight: 600 }}>{fmtMoneyShort(total)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </Card>
  );
}

  <script type="text/babel" data-presets="react">
// ── App root ───────────────────────────────────────────
const { useState: useState_, useMemo: useMemo_ } = React;

function App() {
  const [tickets, setTickets] = useState_(TICKETS);

  const updateTicket = (t) => setTickets(prev => prev.map(x => x.id === t.id ? t : x));
  const submitTicket = (form) => {

        ))}
        <div className="rail-spacer"></div>
        <div className="rail-divider"></div>
        <div className={`rail-item ${railActive === "settings" ? "active" : ""}`}
             title="Settings"
             onClick={() => goto("settings")}>
          <i className="ti ti-settings"></i>
        </div>
        <div className="rail-item" title="Khalifa" style={{ background: "#FF9900", color: "#14130F", fontWeight: 700, fontSize: 13 }}>
          MK
        </div>
      </aside>

      {/* ── WORKSPACE ── */}
      <div className="workspace">
        <header className="topbar">
          <div className="crumbs">{crumbs}</div>

          <div className="ticker">
            <div className="ticker-item"><span className="tdot" style={{ background: "var(--ok)" }}></span>{openCount} open tickets</div>
            <div className="ticker-item"><span className="tdot" style={{ background: "var(--accent)" }}></span>{needsDecision} need your call</div>
            <div className="ticker-item"><span className="tdot" style={{ background: "var(--info)" }}></span>{tickets.filter(t => t.status === "In Maintenance").length} vendors on-site</div>
          </div>

          <div className="search">
            <i className="ti ti-search"></i>
            <input placeholder="Search anything…" />
            <span className="kbd">⌘K</span>
          </div>

          <button className="btn btn-accent" onClick={newTicket}>
            <i className="ti ti-plus"></i> New ticket
          </button>
        </header>

        <main className="canvas">
          {route.view === "ops" && <OpsView
            tickets={tickets} branches={branches} vendors={vendors} agents={agents}
            onOpenTicket={openTicket} onOpenBranch={openBranch} onGotoView={goto} />}

          {route.view === "tickets" && <TicketsView
            tickets={tickets} branches={branches} vendors={vendors} agents={agents}
            onOpenTicket={openTicket} onNewTicket={newTicket} />}

          {route.view === "ticket" && selectedTicket && <TicketDetail
            ticket={selectedTicket} branches={branches} vendors={vendors} agents={agents}
            onUpdate={updateTicket} />}

          {route.view === "new-ticket" && <NewTicket
            branches={branches} vendors={vendors} agents={agents}
            onSubmit={submitTicket} onCancel={() => goto("tickets")} />}

          {route.view === "branches" && <BranchesView
            branches={branches} tickets={tickets}
            onOpenBranch={openBranch} />}

          {route.view === "branch" && selectedBranch && <BranchDetail
            branch={selectedBranch} branches={branches} tickets={tickets}
            vendors={vendors} agents={agents}
            onOpenTicket={openTicket} />}

          {route.view === "vendors" && <VendorsView
            vendors={vendors} tickets={tickets} branches={branches} />}

          {route.view === "reports" && <ReportsView
            tickets={tickets} branches={branches} vendors={vendors} agents={agents} />}

          {route.view === "settings" && <SettingsView
            branches={branches} vendors={vendors} agents={agents} />}
        </main>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
